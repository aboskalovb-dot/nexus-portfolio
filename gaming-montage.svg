<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="title desc">
<title id="title">NEXUS gaming montage</title><desc id="desc">Neon purple gaming video editing preview with clapperboard, play symbol and multitrack timeline.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#211944"/><stop offset=".6" stop-color="#151a37"/><stop offset="1" stop-color="#08283b"/></linearGradient>
 <linearGradient id="purple" x2="1" y2="1"><stop stop-color="#c084fc"/><stop offset="1" stop-color="#6d35df"/></linearGradient>
 <linearGradient id="blue" x2="1"><stop stop-color="#65d4ff"/><stop offset="1" stop-color="#5576e8"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#a18cff" stroke-opacity=".07"/></pattern>
</defs>
<rect width="720" height="405" fill="url(#bg)"/><rect width="720" height="405" fill="url(#grid)"/>
