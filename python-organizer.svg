<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" role="img" aria-labelledby="title desc">
<title id="title">NEXUS Python file organizer</title><desc id="desc">Futuristic neon-purple file organizer interface with glowing folders and progress indicators.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#171333"/><stop offset=".55" stop-color="#11172d"/><stop offset="1" stop-color="#091c2d"/></linearGradient>
 <linearGradient id="violet" x2="1" y2="1"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#5b3bd7"/></linearGradient>
 <linearGradient id="line" x2="1"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#43c7ff"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#9d8cff" stroke-opacity=".08"/></pattern>
</defs>
<rect width="720" height="405" fill="url(#bg)"/><rect width="720" height="405" fill="url(#grid)"/>
<circle cx="570" cy="185" r="150" fill="#7139db" opacity=".13" filter="url(#glow)"/>
<rect x="24" y="22" width="672" height="361" rx="22" fill="#0d1025" stroke="#8058ed" stroke-opacity=".7"/>
<rect x="24" y="22" width="672" height="52" rx="22" fill="#211c43"/>
<circle cx="52" cy="48" r="7" fill="#ff648f"/><circle cx="76" cy="48" r="7" fill="#ffca68"/><circle cx="100" cy="48" r="7" fill="#54e2b0"/>
<text x="360" y="54" text-anchor="middle" fill="#e5e0ff" font-size="16" font-family="Arial" letter-spacing="2">NEXUS • FILE ORGANIZER</text>
<text x="58" y="119" fill="#c4a5ff" font-size="14" font-family="Arial" font-weight="700" letter-spacing="2">PYTHON UTILITY</text>
<text x="58" y="158" fill="#fff" font-size="27" font-family="Arial" font-weight="700">Умная сортировка файлов</text>
<text x="58" y="185" fill="#aeb5d4" font-size="14" font-family="Arial">Порядок в проектах — в один клик</text>
<rect x="58" y="211" width="365" height="52" rx="11" fill="#141a35" stroke="#6550b6"/>
<path d="M78 230h18l8 8v13H78z M96 230v9h8" fill="none" stroke="#bca1ff" stroke-width="2"/>
<text x="119" y="243" fill="#aeb5d4" font-size="14" font-family="Arial">Выбрать папку проекта...</text>
<rect x="58" y="283" width="365" height="13" rx="7" fill="#252b4c"/><rect x="58" y="283" width="295" height="13" rx="7" fill="url(#line)" filter="url(#glow)"/>
<text x="58" y="322" fill="#7de6c1" font-size="13" font-family="Arial">ГОТОВО • 100% ПРОВЕРЕНО</text>
<g transform="translate(470 112)" filter="url(#glow)">
 <path d="M15 52h70l18 18h112v126H15z" fill="#30205f" stroke="#a879ff" stroke-width="3"/>
 <path d="M15 52V35q0-10 10-10h55l18 20h27q10 0 10 10v7" fill="#4a2a91" stroke="#c19aff" stroke-width="3"/>
 <path d="M54 93h118v76H54z" rx="8" fill="#171b3c" stroke="#7b67e8" stroke-width="2"/>
 <path d="M76 116h73M76 133h55M76 150h66" stroke="#8d7bff" stroke-width="5" stroke-linecap="round"/>
 <circle cx="168" cy="77" r="25" fill="url(#violet)" stroke="#d4b8ff" stroke-width="2"/><text x="168" y="86" text-anchor="middle" fill="#fff" font-size="26" font-family="Arial" font-weight="700">N</text>
</g>
<g font-family="Arial" font-size="13" fill="#d8d4f4"><text x="475" y="330">IMAGES</text><text x="555" y="330">DOCS</text><text x="628" y="330">VIDEO</text></g>
<g fill="#a78bfa"><rect x="474" y="343" width="60" height="5" rx="3"/><rect x="554" y="343" width="60" height="5" rx="3"/><rect x="626" y="343" width="46" height="5" rx="3"/></g>
</svg>